name: Build Debugify

on:
  push:
    branches:
      - 1.21.9
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Run assembleDebug
        run: ./gradlew assembleDebug

      - name: List build outputs (for debugging)
        run: |
          echo "===== build tree ====="
          find . -type f | sed -e 's/\.\///g' | sort
          echo "===== done ====="

      - name: Upload artifact
        # Adjust the path to where the .jar is located
        uses: actions/upload-artifact@v4
        with:
          name: Debugify-debug
          path: |
            **/build/libs/*.jar
            **/build/outputs/**/*.jar
